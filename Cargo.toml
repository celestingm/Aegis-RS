[package]
name = "aegis-rs"
version = "0.1.0"
edition = "2021"
description = "Lightweight self-healing monitoring agent: system metrics, Docker health, auto-remediation and chat notifications"
license = "MIT"
repository = "https://github.com/celestingm/Aegis-RS"
readme = "README.md"
keywords = ["monitoring", "docker", "self-healing", "observability"]
categories = ["command-line-utilities"]

[dependencies]
tokio = { version = "1.36", features = ["full"] }
axum = "0.7"
sysinfo = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tower = { version = "0.4", features = ["util"] }
async-trait = "0.1"
tower-http = { version = "0.5", features = ["trace"] }
toml = "0.8"
clap = { version = "4.4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
chrono = { version = "0.4", features = ["serde"] }
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "bitmap_backend", "bitmap_encoder", "line_series", "area_series", "ab_glyph", "ttf", "font-kit"] }
image = { version = "0.24", default-features = false, features = ["png"] }
base64 = "0.21"
